name: Nightly Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

# Never let two nightly builds race for the same tags
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  release-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockcg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is enough to push to this repo's own package and never
      # expires. A PAT (secrets.GHCR_TOKEN) only buys the ability to push to
      # *another* namespace, and it silently breaks the build once it expires.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # frontend-dist is built inside the Dockerfile (build_frontend stage),
      # so there is no Node setup / npm ci step here anymore.
      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: nightly
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # `latest` is reserved for tagged releases (release.yml)
          tags: |
            ${{ env.IMAGE_NAME }}:nightly
            ${{ env.IMAGE_NAME }}:edge
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=nightly
          cache-from: type=gha,scope=dockcg-nightly
          cache-to: type=gha,mode=max,scope=dockcg-nightly
