name: Release

# Push a version tag to publish a stable image:
#   git tag v1.5.0 && git push origin v1.5.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.5.0"
        required: true

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dockcg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # 1.5.0 / 1.5 / 1 / latest, derived from the git tag
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Dockcg
            org.opencontainers.image.description=A compose-first stack manager for Docker
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dockcg-nightly
          cache-to: type=gha,mode=max,scope=dockcg-release

      # The pushed tags are only half the story: the package also has to be
      # public, otherwise every `docker pull` asks for credentials.
      - name: Remind about package visibility
        run: |
          echo "::notice title=Check package visibility::https://github.com/users/${{ github.repository_owner }}/packages/container/dockcg/settings — set visibility to Public, or anonymous pulls return 401/denied."

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            && echo "release already exists" \
            || gh release create "${{ github.ref_name }}" --generate-notes \
                 --title "${{ github.ref_name }}"
