services:
  dockcg:
    # Pulled from GitHub Container Registry.
    #   latest  = tagged release (v*)
    #   nightly = every push to master
    image: ghcr.io/strange-dragon/dockcg:latest

    # Build from source instead of pulling the image. `docker compose up -d --build`
    # also works without uncommenting this block.
    # build:
    #   context: .
    #   dockerfile: docker/Dockerfile
    #   target: release

    restart: unless-stopped
    ports:
      # Host Port : Container Port
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

      # Registry logins made on the HOST live in /root/.docker/config.json, which
      # is invisible from inside the container. Mount it to reuse those logins
      # (and to keep the ones Dockcg creates after the container is recreated):
      # - /root/.docker/:/root/.docker

      # Stacks Directory
      # ⚠️ READ IT CAREFULLY. If you did it wrong, your data could end up writing into a WRONG PATH.
      # ⚠️ 1. FULL path only. No relative path (MUST)
      # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
      - /opt/stacks:/opt/stacks
    environment:
      # Tell Dockcg where is your stacks directory
      - DOCKCG_STACKS_DIR=/opt/stacks
